<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小舟 · Kobune Sushi</title>
  <meta name="description" content="一家可以探索的日式小店：看菜单、和师傅聊天、自选鱼生、收集刺身图鉴。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Yuji+Syuku&family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hud">
    <div class="brand">
      <span class="brand-mark">舟</span>
      <div>
        <h1 data-i18n="shop.name">小舟</h1>
        <p data-i18n="shop.sub">こぶね · 鮨 · Kobune Sushi</p>
      </div>
    </div>
    <nav class="hud-actions">
      <button class="hud-btn" data-open="seats" id="hud-seat">座位：未选</button>
      <button class="hud-btn" data-open="zukan" id="hud-zukan">图鉴 0/0</button>
      <button class="hud-btn hud-lang" id="lang-toggle" aria-label="Switch to English">EN</button>
      <button class="hud-btn hud-cart" data-open="cart" id="hud-cart">お会計 <b>0</b></button>
    </nav>
  </header>

  <main class="stage">
    <p class="hint" data-i18n="hint">将鼠标移到店内各处探索，点击即可互动</p>

    <svg class="scene" viewBox="0 0 1200 700" role="img" aria-label="小舟店内">
      <defs>
        <linearGradient id="g-wall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#efe3c8"/>
          <stop offset="1" stop-color="#e2d2b0"/>
        </linearGradient>
        <linearGradient id="g-floor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8f6640"/>
          <stop offset="1" stop-color="#6e4a2b"/>
        </linearGradient>
        <linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#dff1f6" stop-opacity=".55"/>
          <stop offset="1" stop-color="#bcdbe4" stop-opacity=".35"/>
        </linearGradient>
        <radialGradient id="g-lantern" cx=".5" cy=".45" r=".6">
          <stop offset="0" stop-color="#ffcf8a"/>
          <stop offset=".55" stop-color="#e0533d"/>
          <stop offset="1" stop-color="#a7271c"/>
        </radialGradient>
      </defs>

      <!-- 墙 / 地板 -->
      <rect width="1200" height="470" fill="url(#g-wall)"/>
      <rect y="0" width="1200" height="26" fill="#5a3a20"/>
      <g fill="#6b4423">
        <rect x="240" y="26" width="14" height="444"/>
        <rect x="930" y="26" width="14" height="444"/>
      </g>
      <rect y="455" width="1200" height="15" fill="#5a3a20"/>
      <rect y="470" width="1200" height="230" fill="url(#g-floor)"/>
      <g stroke="#5b3b20" stroke-width="2" opacity=".5">
        <line x1="0" y1="530" x2="1200" y2="530"/>
        <line x1="0" y1="600" x2="1200" y2="600"/>
        <line x1="0" y1="670" x2="1200" y2="670"/>
      </g>

      <!-- 灯笼（装饰） -->
      <g class="lantern" style="transform-origin: 330px 30px">
        <line x1="330" y1="26" x2="330" y2="48" stroke="#333" stroke-width="2"/>
        <rect x="314" y="46" width="32" height="8" fill="#222"/>
        <ellipse cx="330" cy="92" rx="30" ry="40" fill="url(#g-lantern)"/>
        <rect x="314" y="128" width="32" height="8" fill="#222"/>
        <text x="330" y="102" class="lantern-text">酒</text>
      </g>
      <g class="lantern" style="transform-origin: 880px 30px; animation-delay: -1.5s">
        <line x1="880" y1="26" x2="880" y2="48" stroke="#333" stroke-width="2"/>
        <rect x="864" y="46" width="32" height="8" fill="#222"/>
        <ellipse cx="880" cy="92" rx="30" ry="40" fill="url(#g-lantern)"/>
        <rect x="864" y="128" width="32" height="8" fill="#222"/>
        <text x="880" y="102" class="lantern-text">鮨</text>
      </g>

      <!-- 入口 + 暖帘 -->
      <g class="hotspot" data-id="noren">
        <rect x="20" y="40" width="210" height="430" fill="#4a2e1a"/>
        <rect x="34" y="56" width="182" height="414" fill="#f4ecd8"/>
        <g stroke="#b59a74" stroke-width="2">
          <line x1="95" y1="56" x2="95" y2="470"/><line x1="155" y1="56" x2="155" y2="470"/>
          <line x1="34" y1="250" x2="216" y2="250"/><line x1="34" y1="330" x2="216" y2="330"/><line x1="34" y1="410" x2="216" y2="410"/>
        </g>
        <rect x="26" y="52" width="198" height="8" fill="#2a1a0e"/>
        <g class="noren">
          <path d="M34 60 h58 v150 q-29 8 -58 0z" fill="#2c3e60"/>
          <path d="M96 60 h58 v150 q-29 8 -58 0z" fill="#2c3e60"/>
          <path d="M158 60 h58 v150 q-29 8 -58 0z" fill="#2c3e60"/>
          <text x="63" y="150" class="noren-text">小</text>
          <text x="125" y="150" class="noren-text">舟</text>
          <text x="187" y="150" class="noren-text">鮨</text>
        </g>
      </g>

      <!-- 门口立牌 -->
      <g class="hotspot" data-id="board">
        <line x1="262" y1="350" x2="248" y2="600" stroke="#5a3a20" stroke-width="7"/>
        <line x1="318" y1="350" x2="332" y2="600" stroke="#5a3a20" stroke-width="7"/>
        <rect x="256" y="340" width="70" height="200" rx="4" fill="#24332b" stroke="#7a5230" stroke-width="7"/>
        <text x="291" y="360" class="chalk-v">本日のおすすめ</text>
        <circle cx="272" cy="520" r="4" fill="#f4a3a3"/>
        <circle cx="286" cy="524" r="4" fill="#fff3b0"/>
        <circle cx="300" cy="520" r="4" fill="#bfe3c0"/>
      </g>

      <!-- 墙上木札 -->
      <g class="hotspot" data-id="tags">
        <rect x="372" y="104" width="210" height="104" fill="transparent"/>
        <rect x="372" y="104" width="210" height="8" fill="#5a3a20"/>
        <g class="tag-row">
          <rect x="380" y="114" width="26" height="92" fill="#e8cf9a" stroke="#8b5a2b"/>
          <rect x="414" y="114" width="26" height="92" fill="#e8cf9a" stroke="#8b5a2b"/>
          <rect x="448" y="114" width="26" height="92" fill="#e8cf9a" stroke="#8b5a2b"/>
          <rect x="482" y="114" width="26" height="92" fill="#e8cf9a" stroke="#8b5a2b"/>
          <rect x="516" y="114" width="26" height="92" fill="#e8cf9a" stroke="#8b5a2b"/>
          <rect x="550" y="114" width="26" height="92" fill="#f0c4b4" stroke="#8b5a2b"/>
          <text x="393" y="122" class="tag-v">天ぷら</text>
          <text x="427" y="122" class="tag-v">焼き鳥</text>
          <text x="461" y="122" class="tag-v">茶碗蒸</text>
          <text x="495" y="122" class="tag-v">枝豆</text>
          <text x="529" y="122" class="tag-v">味噌汁</text>
          <text x="563" y="122" class="tag-v">甘味</text>
        </g>
      </g>

      <!-- 酒架 -->
      <g class="hotspot" data-id="drinks">
        <rect x="712" y="86" width="190" height="152" fill="transparent"/>
        <rect x="712" y="150" width="190" height="8" fill="#6b4423"/>
        <rect x="712" y="230" width="190" height="8" fill="#6b4423"/>
        <g>
          <rect x="724" y="104" width="18" height="46" rx="3" fill="#2f5d3a"/><rect x="729" y="92" width="8" height="14" fill="#2f5d3a"/>
          <rect x="752" y="110" width="20" height="40" rx="3" fill="#e8eef0" stroke="#9aa"/><rect x="758" y="98" width="8" height="14" fill="#c33"/>
          <rect x="782" y="100" width="18" height="50" rx="3" fill="#6b3a1a"/><rect x="787" y="88" width="8" height="14" fill="#6b3a1a"/>
          <rect x="810" y="112" width="24" height="38" rx="8" fill="#c98a2e"/>
          <rect x="844" y="104" width="18" height="46" rx="3" fill="#1f3550"/><rect x="849" y="92" width="8" height="14" fill="#1f3550"/>
          <rect x="870" y="114" width="22" height="36" rx="3" fill="#e8eef0" stroke="#9aa"/>
          <rect x="724" y="196" width="26" height="34" rx="4" fill="#f4ecd8" stroke="#8b5a2b"/>
          <rect x="758" y="196" width="26" height="34" rx="4" fill="#f4ecd8" stroke="#8b5a2b"/>
          <circle cx="815" cy="214" r="16" fill="#5d7a3a"/>
          <rect x="842" y="190" width="18" height="40" rx="3" fill="#a33"/>
          <rect x="868" y="196" width="24" height="34" rx="4" fill="#f4ecd8" stroke="#8b5a2b"/>
        </g>
      </g>

      <!-- 挂轴（图鉴） -->
      <g class="hotspot" data-id="zukan">
        <rect x="992" y="70" width="96" height="10" rx="4" fill="#4a2e1a"/>
        <rect x="1000" y="80" width="80" height="250" fill="#2c3e60"/>
        <rect x="1008" y="92" width="64" height="200" fill="#f6efdf"/>
        <circle cx="1040" cy="130" r="20" fill="none" stroke="#c0392b" stroke-width="3"/>
        <path d="M1024 132 q16 -14 32 0 q-16 14 -32 0z m32 0 l8 -7 v14z" fill="#2b2b2b"/>
        <text x="1040" y="172" class="scroll-v">魚図鑑</text>
        <rect x="994" y="328" width="92" height="10" rx="4" fill="#4a2e1a"/>
      </g>

      <!-- 师傅 -->
      <g class="hotspot" data-id="chef">
        <g class="chef-idle">
          <path d="M582 410 Q586 302 640 292 Q694 302 698 410 Z" fill="#fbfbf8" stroke="#c9c4b8" stroke-width="2"/>
          <path d="M624 296 L640 324 L656 296" fill="none" stroke="#c9c4b8" stroke-width="3"/>
          <path d="M594 316 Q572 340 566 364" stroke="#fbfbf8" stroke-width="22" stroke-linecap="round" fill="none"/>
          <path d="M686 316 Q708 340 716 362" stroke="#fbfbf8" stroke-width="22" stroke-linecap="round" fill="none"/>
          <circle cx="564" cy="368" r="10" fill="#f1c7a0"/>
          <circle cx="718" cy="366" r="10" fill="#f1c7a0"/>
          <g class="knife">
            <rect x="712" y="356" width="8" height="18" rx="2" fill="#5a3a20"/>
            <path d="M716 356 L708 310 L722 312 Z" fill="#d8dde0" stroke="#9aa3a8"/>
          </g>
          <rect x="630" y="270" width="20" height="26" fill="#f1c7a0"/>
          <circle cx="640" cy="248" r="30" fill="#f1c7a0"/>
          <path d="M610 248 Q610 214 640 214 Q670 214 670 248 Q656 234 640 234 Q624 234 610 248Z" fill="#2b2b2b"/>
          <rect x="609" y="228" width="62" height="10" rx="3" fill="#2c3e60"/>
          <path d="M668 232 l16 -6 l-4 12z M668 234 l14 8 l-12 2z" fill="#2c3e60"/>
          <path d="M625 252 q5 -5 10 0 M645 252 q5 -5 10 0" stroke="#2b2b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="622" cy="262" r="5" fill="#f3a6a0" opacity=".7"/>
          <circle cx="658" cy="262" r="5" fill="#f3a6a0" opacity=".7"/>
          <path d="M633 265 q7 6 14 0" stroke="#7a3b2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 吧台 -->
      <polygon points="360,384 920,384 944,404 336,404" fill="#d6a86e"/>
      <rect x="336" y="404" width="608" height="106" fill="#7a4b28"/>
      <g stroke="#5e381c" stroke-width="3">
        <line x1="488" y1="404" x2="488" y2="510"/><line x1="640" y1="404" x2="640" y2="510"/><line x1="792" y1="404" x2="792" y2="510"/>
      </g>
      <rect x="600" y="374" width="96" height="10" rx="2" fill="#e9cfa0"/>

      <!-- 鱼柜 -->
      <g class="hotspot" data-id="fishcase">
        <rect x="392" y="372" width="176" height="12" fill="#f4f8fa"/>
        <rect x="404" y="358" width="34" height="14" rx="3" fill="#f28a36"/>
        <rect x="442" y="358" width="34" height="14" rx="3" fill="#b3202f"/>
        <rect x="480" y="358" width="34" height="14" rx="3" fill="#f6ece6"/>
        <rect x="518" y="358" width="38" height="14" rx="6" fill="#f7a08a"/>
        <g stroke="#fff" stroke-width="1.5" opacity=".8">
          <line x1="410" y1="360" x2="406" y2="370"/><line x1="418" y1="360" x2="414" y2="370"/><line x1="426" y1="360" x2="422" y2="370"/>
        </g>
        <path d="M392 384 L392 340 L568 340 L568 384 Z" fill="url(#g-glass)" stroke="#8fb0ba" stroke-width="2"/>
        <line x1="392" y1="340" x2="410" y2="326" stroke="#8fb0ba" stroke-width="2"/>
        <line x1="568" y1="340" x2="550" y2="326" stroke="#8fb0ba" stroke-width="2"/>
        <line x1="410" y1="326" x2="550" y2="326" stroke="#8fb0ba" stroke-width="2"/>
      </g>

      <!-- 招财猫 -->
      <g class="hotspot" data-id="neko">
        <g class="neko">
          <ellipse cx="880" cy="372" rx="20" ry="16" fill="#fffaf2" stroke="#d6c7b0" stroke-width="2"/>
          <circle cx="880" cy="346" r="16" fill="#fffaf2" stroke="#d6c7b0" stroke-width="2"/>
          <path d="M867 336 l2 -12 l8 8z M893 336 l-2 -12 l-8 8z" fill="#fffaf2" stroke="#d6c7b0" stroke-width="2"/>
          <path d="M873 346 q2 -2 4 0 M883 346 q2 -2 4 0" stroke="#333" stroke-width="1.5" fill="none"/>
          <rect x="868" y="358" width="24" height="5" rx="2" fill="#c0392b"/>
          <circle cx="880" cy="366" r="4" fill="#e3b341"/>
          <g class="neko-paw"><ellipse cx="900" cy="338" rx="6" ry="9" fill="#fffaf2" stroke="#d6c7b0" stroke-width="2"/></g>
        </g>
      </g>

      <!-- 吧台座位 -->
      <g class="hotspot" data-id="seats">
        <rect x="396" y="536" width="468" height="104" fill="transparent"/>
        <g class="stool"><line x1="430" y1="552" x2="420" y2="640" stroke="#3b2414" stroke-width="5"/><line x1="430" y1="552" x2="440" y2="640" stroke="#3b2414" stroke-width="5"/><ellipse cx="430" cy="548" rx="34" ry="10" fill="#9e2b25"/></g>
        <g class="stool"><line x1="530" y1="552" x2="520" y2="640" stroke="#3b2414" stroke-width="5"/><line x1="530" y1="552" x2="540" y2="640" stroke="#3b2414" stroke-width="5"/><ellipse cx="530" cy="548" rx="34" ry="10" fill="#9e2b25"/></g>
        <g class="stool"><line x1="630" y1="552" x2="620" y2="640" stroke="#3b2414" stroke-width="5"/><line x1="630" y1="552" x2="640" y2="640" stroke="#3b2414" stroke-width="5"/><ellipse cx="630" cy="548" rx="34" ry="10" fill="#9e2b25"/></g>
        <g class="stool"><line x1="730" y1="552" x2="720" y2="640" stroke="#3b2414" stroke-width="5"/><line x1="730" y1="552" x2="740" y2="640" stroke="#3b2414" stroke-width="5"/><ellipse cx="730" cy="548" rx="34" ry="10" fill="#9e2b25"/></g>
        <g class="stool"><line x1="830" y1="552" x2="820" y2="640" stroke="#3b2414" stroke-width="5"/><line x1="830" y1="552" x2="840" y2="640" stroke="#3b2414" stroke-width="5"/><ellipse cx="830" cy="548" rx="34" ry="10" fill="#9e2b25"/></g>
      </g>

      <!-- 榻榻米座敷 -->
      <g class="hotspot" data-id="seats">
        <polygon points="960,480 1200,480 1200,700 910,700" fill="#cfc98e" stroke="#6f7a3c" stroke-width="4"/>
        <line x1="935" y1="590" x2="1200" y2="590" stroke="#6f7a3c" stroke-width="3"/>
        <ellipse cx="1000" cy="640" rx="38" ry="14" fill="#6a3d6b"/>
        <ellipse cx="1150" cy="640" rx="38" ry="14" fill="#6a3d6b"/>
        <rect x="1000" y="584" width="12" height="38" fill="#5a3a20"/>
        <rect x="1138" y="584" width="12" height="38" fill="#5a3a20"/>
        <rect x="980" y="566" width="190" height="22" rx="4" fill="#7a4b28"/>
        <rect x="980" y="562" width="190" height="8" rx="3" fill="#9a6538"/>
      </g>

      <!-- 桌面菜单 -->
      <g class="hotspot" data-id="tablemenu">
        <polygon points="1046,562 1074,510 1102,562" fill="#f6efdf" stroke="#8b5a2b" stroke-width="2"/>
        <polygon points="1074,510 1102,562 1108,560 1080,510" fill="#d9c9a6"/>
        <rect x="1062" y="530" width="24" height="4" fill="#c0392b"/>
        <text x="1074" y="552" class="mini-text">品書</text>
      </g>

      <!-- 客人（选座后出现，由 app.js 绘制） -->
      <g id="guest" class="hotspot" data-id="guest" style="display:none"></g>
    </svg>

    <div id="tooltip" class="tooltip" hidden></div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <section id="modal" class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
      <div id="modal-body"></div>
    </section>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data.en.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
