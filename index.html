<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小舟 · Kobune Sushi</title>
  <meta name="description" content="一家可以探索的日式小店：看菜单、和师傅聊天、自选鱼生、收集刺身图鉴。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Yuji+Syuku&family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hud">
    <div class="brand">
      <span class="brand-mark">舟</span>
      <div>
        <h1 data-i18n="shop.name">小舟</h1>
        <p data-i18n="shop.sub">こぶね · 鮨 · Kobune Sushi</p>
      </div>
    </div>
    <nav class="hud-actions">
      <button class="hud-btn" data-open="seats" id="hud-seat">座位：未选</button>
      <button class="hud-btn" data-open="zukan" id="hud-zukan">图鉴 0/0</button>
      <button class="hud-btn hud-lang" id="lang-toggle" aria-label="Switch to English">EN</button>
      <button class="hud-btn hud-cart" data-open="cart" id="hud-cart">お会計 <b>0</b></button>
    </nav>
  </header>

  <main class="stage">
    <p class="hint" data-i18n="hint">将鼠标移到店内各处探索，点击即可互动</p>

    <div class="scene-scroll">
      <svg class="scene" viewBox="0 0 1200 800" role="group" aria-label="小舟店内">
        <defs>
          <clipPath id="chef-counter-mask"><rect x="515" y="175" width="220" height="294"/></clipPath>
          <radialGradient id="lamp-light"><stop stop-color="#ffe3a3" stop-opacity=".32"/><stop offset="1" stop-color="#ffe3a3" stop-opacity="0"/></radialGradient>
          <linearGradient id="guest-cloth"><stop stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#201e2a" stop-opacity=".25"/></linearGradient>
          <filter id="guest-soft"><feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#382519" flood-opacity=".3"/></filter>
        </defs>
        <!-- 原创微缩场景底图；所有点击区域与绘制坐标共用一个 viewBox。 -->
        <image class="room-art" href="assets/art/izakaya-room.webp" width="1200" height="800"/>
        <g class="ambient-light" pointer-events="none"><ellipse cx="312" cy="140" rx="130" ry="160" fill="url(#lamp-light)"/><ellipse cx="930" cy="140" rx="130" ry="160" fill="url(#lamp-light)"/></g>
        <!-- 师傅独立于背景，腰部由吧台边缘遮挡。 -->
        <g clip-path="url(#chef-counter-mask)"><g class="chef-idle" id="chef-figure"></g></g>
        <g class="steam" pointer-events="none" fill="none" stroke="#fff8e9" stroke-width="3" stroke-linecap="round"><path d="M365 343 q-12 -14 0 -27 t0 -27"/><path d="M387 351 q12 -14 0 -27 t0 -27"/></g>
        <!-- 热点保留原有 data-id，轮廓随真实物体定位；非悬停时不遮挡美术。 -->
        <g class="hotspot" data-id="noren"><path class="hit-area" d="M18 112 L205 148 L205 583 L18 625 Z"/><text class="room-sign" x="115" y="245">小 舟</text></g>
        <g class="hotspot" data-id="board"><path class="hit-area" d="M170 546 L287 530 L307 719 L157 729 Z"/><text class="room-sign board-sign" x="230" y="585">本日の鮮魚</text><circle class="hotspot-dot" cx="230" cy="659" r="7"/></g>
        <g class="hotspot" data-id="tags"><rect class="hit-area" x="395" y="125" width="222" height="109" rx="8"/><g class="menu-lettering"><text x="417" y="151">天ぷら</text><text x="454" y="151">焼き鳥</text><text x="490" y="151">茶碗蒸</text><text x="527" y="151">枝豆</text><text x="564" y="151">甘味</text></g></g>
        <g class="hotspot" data-id="drinks"><rect class="hit-area" x="715" y="118" width="196" height="281" rx="10"/><circle class="hotspot-dot" cx="800" cy="305" r="7"/></g>
        <g class="hotspot" data-id="zukan"><rect class="hit-area" x="1040" y="90" width="100" height="275" rx="10"/><circle class="hotspot-dot" cx="1090" cy="337" r="7"/></g>
        <g class="hotspot" data-id="chef"><rect class="hit-area" x="540" y="199" width="177" height="266" rx="45"/><circle class="hotspot-dot" cx="633" cy="428" r="7"/></g>
        <g class="hotspot" data-id="fishcase"><rect class="hit-area" x="320" y="402" width="291" height="81" rx="10"/><circle class="hotspot-dot" cx="462" cy="448" r="7"/></g>
        <g class="hotspot" data-id="neko"><rect class="hit-area" x="865" y="393" width="70" height="92" rx="20"/><circle class="hotspot-dot" cx="900" cy="454" r="7"/></g>
        <g class="hotspot" data-id="seats"><rect class="hit-area" x="303" y="557" width="574" height="113" rx="25"/><circle class="hotspot-dot" cx="597" cy="588" r="7"/></g>
        <g class="hotspot" data-id="seats"><path class="hit-area" d="M990 516 L1200 570 L1200 729 L978 655 Z"/><circle class="hotspot-dot" cx="1047" cy="561" r="7"/></g>
        <g class="hotspot" data-id="tablemenu"><path class="hit-area" d="M1100 465 L1147 470 L1141 528 L1096 524 Z"/><circle class="hotspot-dot" cx="1122" cy="504" r="5"/></g>
        <!-- 客人保留所有自定义选项和存档，座位坐标与新场景匹配。 -->
        <g id="guest" class="hotspot" data-id="guest" style="display:none"></g>
      </svg>
    </div>
    <nav class="scene-shortcuts" aria-label="店内探索 / Explore the shop">
      <button data-open="tablemenu" data-i18n="scene.menu">翻开菜单</button>
      <button data-open="fishcase" data-i18n="scene.fish">自选鱼生</button>
      <button data-open="chef" data-i18n="scene.chef">和春田聊聊</button>
      <button data-open="neko" data-i18n="scene.luck">抽一支签</button>
    </nav>
    <p class="scene-caption" data-i18n="scene.caption">一盏暖灯，一碗热饭。今晚，慢慢来。</p>

    <!-- 食物插画上很淡的纸张颗粒（art.js） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="kb-grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="3" result="noise"/>
        <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.27  0 0 0 -1.1 0.62" result="dots"/>
        <feComposite in="dots" in2="SourceGraphic" operator="in" result="speckle"/>
        <feComponentTransfer in="speckle" result="soft-speckle"><feFuncA type="linear" slope=".2"/></feComponentTransfer>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="soft-speckle"/></feMerge>
      </filter>
    </svg>

    <div id="tooltip" class="tooltip" hidden></div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <section id="modal" class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
      <div id="modal-body"></div>
    </section>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data.en.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
